[package]
name = "zapp"
version = "0.1.0"
edition = "2024"

[lib]
name = "zapp"
version = "0.1.0"

[dependencies]
glyphon = "0.11"
image = "0.25"
nalgebra = { version = "0.35", features = ["serde-serialize"] }
